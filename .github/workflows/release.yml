name: release

# A tag is the only trigger. `just bump <version>` writes the version into
# Cargo.toml, Cargo.lock and debian/changelog and creates the v<version> tag, so
# a tag that disagrees with the sources means something bypassed that step and
# the build stops before producing anything.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deb:
    name: build .deb and publish the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config g++ dpkg-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - name: Tag, Cargo.toml and debian/changelog must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          changelog=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          echo "tag=$tag  Cargo.toml=$cargo  debian/changelog=$changelog"
          if [ "$tag" != "$cargo" ]; then
            echo "::error::tag $tag does not match Cargo.toml $cargo (run 'just bump $tag' and tag that commit)"
            exit 1
          fi
          if [ "$tag" != "$changelog" ]; then
            echo "::error::tag $tag does not match debian/changelog $changelog"
            exit 1
          fi

      - name: Test
        run: |
          just check
          just test

      - name: Build the package
        run: |
          just deb
          mkdir -p dist
          cp ../fcitx5-vnkey_*.deb dist/
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          ls -l

      # `gh` ships on the runners, so the release step needs no third-party
      # action and no version of one to keep working.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.deb dist/SHA256SUMS
